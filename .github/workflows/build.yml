name: Windows x64 VST3 Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  windows-vst3:
    name: Windows x64 VST3
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        shell: powershell
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        shell: powershell
        run: |
          cmake --build build --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-VST3
          path: |
            build/**/*.vst3
