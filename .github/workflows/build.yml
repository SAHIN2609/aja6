name: Windows x64 VST3 MSVC Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  windows-vst3:
    name: Windows x64 VST3
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Clean Build
        shell: cmd
        run: |
          if exist build rmdir /s /q build

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        shell: cmd
        run: |
          cmake --build build --config Release --parallel

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SISHHIN-HZ-MACHINE-Windows-x64-VST3
          path: |
            build/**/*.vst3
